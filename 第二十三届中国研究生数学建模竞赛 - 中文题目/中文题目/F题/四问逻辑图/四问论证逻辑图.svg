<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2180" viewBox="0 0 2600 2180"><defs><marker id="arrow-315b84" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#315b84" /></marker><marker id="arrow-2f746f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f746f" /></marker><marker id="arrow-a05e2b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a05e2b" /></marker><marker id="arrow-665894" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#665894" /></marker><marker id="arrow-607086" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#607086" /></marker><marker id="arrow-203650" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#203650" /></marker></defs><rect x="0" y="0" width="2600" height="2180" fill="#101214" /><polyline points="60,617 60,729" fill="none" stroke="#6bc9af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-6bc9af)" /><polyline points="60,1148 60,1257" fill="none" stroke="#e1ab69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-e1ab69)" /><polyline points="60,1572 60,1681" fill="none" stroke="#b4a0e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-b4a0e6)" /><rect x="31" y="26" width="5" height="102" rx="0" ry="0" fill="#62b5d4" stroke="none" stroke-width="1" /><text x="86" y="73.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="700" fill="#eceff2" text-anchor="start"><tspan x="86" dy="0">四问论证技术路线</tspan></text><text x="88" y="123.2" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#aab4bd" text-anchor="start"><tspan x="88" dy="0">每行写明：证据从哪里来 → 经何种推理或验证 → 得到什么结论；过渡带写明跨问传递的量与假设。</tspan></text><rect x="37" y="160" width="5" height="462" rx="0" ry="0" fill="#62b5d4" stroke="none" stroke-width="1" /><rect x="85" y="153" width="84" height="40" rx="7" ry="7" fill="#62b5d4" stroke="none" stroke-width="1" /><text x="127.0" y="181.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#101214" text-anchor="middle"><tspan x="127.0" dy="0">Q1</tspan></text><text x="187" y="183.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="187" dy="0">第一问｜从原始数据到质量评分、配比预测与可传递接口</tspan></text><rect x="86" y="206" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="236.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">质量输入</tspan></text><text x="280" y="236.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A1 全量抽样＋A2/A3 扩展全集 → 22 项质量指标 → 方向统一与截尾归一化 → 线性评分 Q_lin</tspan></text><rect x="86" y="258" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="288.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">冲突消解</tspan></text><text x="280" y="288.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">严格互斥的高/低尾部 → 指标对冲突与四维失衡 CI → 加权几何聚合 → 样本质量 Q_res</tspan></text><rect x="86" y="310" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="340.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">独立复核</tspan></text><text x="280" y="340.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A2/A3 中与 A1 ID 不重叠的余集 → 冻结尾部切点复核；去重聚合 → 7 个质量域 Q_d</tspan></text><rect x="86" y="362" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="392.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">质量映射</tspan></text><text x="280" y="392.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A16 的领域关系 → 7 个质量域映射到 17 个配方域 Q_i；无直接映射的 11 域作均值回退</tspan></text><rect x="86" y="414" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="444.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">配比模型</tspan></text><text x="280" y="444.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A4/A5：512 组配比 × 13 验证域 Loss → 对数线性／SCM → 训练侧稳定筛选 SCI → 均值预测</tspan></text><rect x="86" y="466" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="496.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">配比推荐</tspan></text><text x="280" y="496.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">SCI 均值＋MPR-MTL 逐域残差 → CVaR 风险推荐 p_risk；凸包内双代理保守推荐 → p_safe</tspan></text><rect x="86" y="518" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="548.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">固定检验</tspan></text><text x="280" y="548.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A6–A11：1M／60M／1B 排序检验；A12–A15：10B／70B 幂律外推表，只作敏感性分析</tspan></text><rect x="86" y="570" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="600.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#62b5d4" text-anchor="start"><tspan x="101" dy="0">关键判断</tspan></text><text x="280" y="600.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">质量有效份额 p_eff∝p·Q_i^η 的内部验证选 η=0 → Q_i 与 p 分通道，不宣称 A 已识别质量效应</tspan></text><rect x="86" y="634" width="2430" height="78" rx="9" ry="9" fill="#1c3137" stroke="none" stroke-width="1" /><text x="112" y="666.35" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="112" dy="0">Q1 → Q2：第一问最终输出 Q_i＝Q_res 的域映射与 p_risk；旧版 Q1 输出对数混料系数及参考配比 p_ref。</tspan><tspan x="112" dy="29.700000000000003">模型角色：SCI 是 Q1 的均值预测器；Q2 为得到可解析的配比桥改用对数模型。p_safe 另由 Q1 直接进入 Q3。</tspan></text><rect x="37" y="742" width="5" height="407" rx="0" ry="0" fill="#6bc9af" stroke="none" stroke-width="1" /><rect x="85" y="735" width="84" height="40" rx="7" ry="7" fill="#6bc9af" stroke="none" stroke-width="1" /><text x="127.0" y="763.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#101214" text-anchor="middle"><tspan x="127.0" dy="0">Q2</tspan></text><text x="187" y="765.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="187" dy="0">第二问｜先识别规模与质量效应，再把第一问的 Q、p 接入广义标度律</tspan></text><rect x="86" y="788" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="818.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">规模骨架</tspan></text><text x="280" y="818.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">B1 轨迹 → 拟合经典 L＝E＋A·N^−α＋B·D^−β → 规模项 R(N,D)；B2–B5 检验迁移</tspan></text><rect x="86" y="840" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="870.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">质量效应</tspan></text><text x="280" y="870.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">B6 比较质量项形式并估计 κ；B7 新质量水平作外层验证；B8 只作机制边界分析</tspan></text><rect x="86" y="892" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="922.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">Q 的衔接</tspan></text><text x="280" y="922.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">Q1 的 Q_i 与配比 p → Q0_A(p)＝Σp_iQ_i；Q_A＝Q_res 经坐标桥映射到 B 的 Q_B</tspan></text><rect x="86" y="944" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="974.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">避免重计</tspan></text><text x="280" y="974.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">以 Q0_A(p) 为当前配比的质量基线 → ψ_Q^rel(Q,p)＝ψ_Q^abs(Q)／ψ_Q^abs(Q0_A(p))</tspan></text><rect x="86" y="996" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1026.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">p 的衔接</tspan></text><text x="280" y="1026.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">Q1 对数混料 L_mix(p)／L_mix(p_ref) → ψ_p(p,N)；SCI 稳定交互只作辅助证据</tspan></text><rect x="86" y="1048" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1078.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">识别边界</tspan></text><text x="280" y="1078.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">A6–A9 同配比跨规模排序可复核结构，但 γ_p 不可单独识别 → 名义 γ_p＝0＋情景敏感性</tspan></text><rect x="86" y="1100" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1130.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#6bc9af" text-anchor="start"><tspan x="101" dy="0">广义结论</tspan></text><text x="280" y="1130.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">L＝E＋R(N,D)·ψ_Q^rel(Q,p)·ψ_p(p,N) → 边际效用／替代条件；B9/B10 仅条件外推</tspan></text><rect x="86" y="1166" width="2430" height="78" rx="9" ry="9" fill="#352b22" stroke="none" stroke-width="1" /><text x="112" y="1198.3500000000001" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="112" dy="0">Q2 → Q3：传 L(N,D,Q,p)、质量基线 Q0_A(p)、κ、配比桥及 γ_p 未识别标记；不能把名义 γ_p 当实测。</tspan><tspan x="112" dy="29.700000000000003">Q3 同时从 Q1 读取可执行 p_risk／p_safe／p_measured；p_ref 只是第二问标度律的参考配比。</tspan></text><rect x="37" y="1270" width="5" height="302" rx="0" ry="0" fill="#e1ab69" stroke="none" stroke-width="1" /><rect x="85" y="1263" width="84" height="40" rx="7" ry="7" fill="#e1ab69" stroke="none" stroke-width="1" /><text x="127.0" y="1291.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#101214" text-anchor="middle"><tspan x="127.0" dy="0">Q3</tspan></text><text x="187" y="1293.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="187" dy="0">第三问｜把广义损失变成预算内资源决策，而非再估计 Q 或配比规律</tspan></text><rect x="86" y="1316" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1346.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e1ab69" text-anchor="start"><tspan x="101" dy="0">决策集合</tspan></text><text x="280" y="1346.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">Q1 配比候选＋Q2 广义损失 → p 取有限可执行集合；p_ref 仅比较基准，不参加最优解</tspan></text><rect x="86" y="1368" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1398.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e1ab69" text-anchor="start"><tspan x="101" dy="0">成本约束</tspan></text><text x="280" y="1398.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">训练成本 6ND＋注意力开销＋质量治理成本；C7 定外生上下文 L_ctx 与注意力临界值</tspan></text><rect x="86" y="1420" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1450.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e1ab69" text-anchor="start"><tspan x="101" dy="0">联合寻优</tspan></text><text x="280" y="1450.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">三档预算 10^19／10^22／10^24；三类质量成本 → 枚举配比与活跃约束，联合求 N、D、Q</tspan></text><rect x="86" y="1472" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1502.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e1ab69" text-anchor="start"><tspan x="101" dy="0">结构转移</tspan></text><text x="280" y="1502.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">Q＝Q0 为 R0，内部质量治理为 R1，Q＝1 为 R2 → 连续预算扫描识别体制变化</tspan></text><rect x="86" y="1524" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1554.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e1ab69" text-anchor="start"><tspan x="101" dy="0">结果边界</tspan></text><text x="280" y="1554.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">输出 (N*,D*,Q*,p*) 与 L*(C)，再作成本／上下文／情景稳健性；高预算标为远距离外推</tspan></text><rect x="86" y="1590" width="2430" height="78" rx="9" ry="9" fill="#2c2839" stroke="none" stroke-width="1" /><text x="112" y="1622.3500000000001" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="112" dy="0">Q3 → Q4：只传最优损失增量 ΔL*＝L*(C₀)−L*(C₁) 作条件性核对，不把绝对 Loss 当绝对能力分。</tspan><tspan x="112" dy="29.700000000000003">Q4 的能力前沿主证据仍来自 C 系列历史记录；Loss–Benchmark 转换须由 C5/C6 单独校准与验证。</tspan></text><rect x="37" y="1694" width="5" height="354" rx="0" ry="0" fill="#b4a0e6" stroke="none" stroke-width="1" /><rect x="85" y="1687" width="84" height="40" rx="7" ry="7" fill="#b4a0e6" stroke="none" stroke-width="1" /><text x="127.0" y="1715.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#101214" text-anchor="middle"><tspan x="127.0" dy="0">Q4</tspan></text><text x="187" y="1717.1" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#e5e9ed" text-anchor="start"><tspan x="187" dy="0">第四问｜历史能力证据为主，第三问最优损失只提供一条旁证通道</tspan></text><rect x="86" y="1740" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1770.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">能力定义</tspan></text><text x="280" y="1770.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">C1 六维榜单 → 综合能力 S／模型类型／开源口径；C8 逐任务重建综合分并检验异质性</tspan></text><rect x="86" y="1792" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1822.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">规模归因</tspan></text><text x="280" y="1822.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">C1×C4 匹配训练算力 → Compute-Q90 前沿；按发布时间做算力／非规模时间漂移／残差分解</tspan></text><rect x="86" y="1844" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1874.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">长期背景</tspan></text><text x="280" y="1874.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">C3：2019–2025 时代视角；C4 变化点与训练算力增长率 → 延续／放缓／停滞情景</tspan></text><rect x="86" y="1896" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1926.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">桥接验证</tspan></text><text x="280" y="1926.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">C5 校准自适应 Loss–Benchmark Logistic 桥；C6 新增模型外层验证，再用 C6 全量重估</tspan></text><rect x="86" y="1948" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="1978.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">增量核对</tspan></text><text x="280" y="1978.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">Q3 的 ΔL*＋当前实测前沿 F0 → 锚定的能力增量；大部分目标预算需远距离外推</tspan></text><rect x="86" y="2000" width="2430" height="46" rx="5" ry="5" fill="#26292c" stroke="none" stroke-width="1" /><text x="101" y="2030.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4a0e6" text-anchor="start"><tspan x="101" dy="0">预测证据</tspan></text><text x="280" y="2030.7" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#d5d9dd" text-anchor="start"><tspan x="280" dy="0">有效滚动回测仅 3 个月，且无前沿刷新；与 Persistence 比较 → 12／24 月只报长期情景</tspan></text><rect x="86" y="2076" width="2430" height="1" rx="0" ry="0" fill="#4b5862" stroke="none" stroke-width="1" /><text x="87" y="2113" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#aab4bd" text-anchor="start"><tspan x="87" dy="0">全链条：A 中质量与配比证据 → B 中 N、D、Q、p 的损失律 → C7 下的预算最优解 → C 历史前沿与条件预测。</tspan><tspan x="87" dy="29.700000000000003">证据边界：SCI 未成为 Q2 主配比桥；γ_p 未识别；Q3 最优是模型内结论；Q4 长期预测没有直接回测。</tspan></text></svg>